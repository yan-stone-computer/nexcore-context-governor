<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NexcoreWork 四区块上下文治理</title>
  <desc id="desc">上下文按固定规则、注入层、对话历史和当前输入分区管理。预算控制器在超限时优先压缩低优先级内容，同时保留约束、原始证据和可回读记录。</desc>
  <defs>
    <marker id="arrow-context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="54" y="60" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.3">CONTEXT WINDOW</text>
    <g id="n:fixed">
      <rect x="54" y="90" width="424" height="72" rx="12" fill="#10272f"/>
      <text x="80" y="120" font-size="16" font-weight="700" fill="#effaf9">01 固定前缀</text>
      <text x="80" y="143" font-size="13" fill="#a8c3c9">系统规则 · 工具协议 · 安全约束</text>
    </g>
    <g id="n:injected">
      <rect x="54" y="178" width="424" height="72" rx="12" fill="#e8faf5" stroke="#54d0b1" stroke-width="1.5"/>
      <text x="80" y="208" font-size="16" font-weight="700" fill="#18323b">02 注入层</text>
      <text x="80" y="231" font-size="13" fill="#58737d">项目记忆 · 技能 · 检索结果</text>
    </g>
    <g id="n:history">
      <rect x="54" y="266" width="424" height="72" rx="12" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="80" y="296" font-size="16" font-weight="700" fill="#18323b">03 对话历史</text>
      <text x="80" y="319" font-size="13" fill="#58737d">消息 · 工具回执 · 文件变化</text>
    </g>
    <g id="n:current">
      <rect x="54" y="354" width="424" height="72" rx="12" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="80" y="384" font-size="16" font-weight="700" fill="#18323b">04 当前输入</text>
      <text x="80" y="407" font-size="13" fill="#58737d">本轮目标 · 附件 · 用户补充</text>
    </g>

    <g id="n:budget">
      <rect x="540" y="112" width="176" height="304" rx="24" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="568" y="153" font-size="13" font-weight="700" fill="#0b7d6c" letter-spacing="1.2">BUDGET</text>
      <text x="568" y="186" font-size="22" font-weight="700" fill="#18323b">上下文预算</text>
      <rect x="568" y="215" width="120" height="18" rx="9" fill="#10272f"/>
      <rect x="568" y="215" width="88" height="18" rx="9" fill="#35d2aa"/>
      <text x="568" y="265" font-size="13" fill="#58737d">规则永远保留</text>
      <text x="568" y="289" font-size="13" fill="#58737d">证据可回读</text>
      <text x="568" y="313" font-size="13" fill="#58737d">历史按序压缩</text>
      <text x="568" y="337" font-size="13" fill="#58737d">低价值内容先删</text>
      <text x="568" y="379" font-size="12" fill="#0a7b6a">本次窗口：可视计量</text>
    </g>

    <g id="n:preserve">
      <rect x="764" y="112" width="150" height="128" rx="18" fill="#ffffff" stroke="#bcdce4" stroke-width="1.5"/>
      <text x="790" y="148" font-size="13" font-weight="700" fill="#0d7387" letter-spacing="1.1">KEEP</text>
      <text x="790" y="180" font-size="17" font-weight="700" fill="#18323b">保留约束</text>
      <text x="790" y="207" font-size="13" fill="#58737d">验收条件与</text>
      <text x="790" y="227" font-size="13" fill="#58737d">关键路径</text>
    </g>
    <g id="n:archive">
      <rect x="764" y="260" width="150" height="156" rx="18" fill="#ecfaef" stroke="#8fdbad" stroke-width="1.5"/>
      <text x="790" y="296" font-size="13" font-weight="700" fill="#2b8a55" letter-spacing="1.1">ARCHIVE</text>
      <text x="790" y="328" font-size="17" font-weight="700" fill="#18323b">原文可回读</text>
      <text x="790" y="356" font-size="13" fill="#58737d">摘要替代上下文</text>
      <text x="790" y="379" font-size="13" fill="#58737d">原文不删除</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.4">
      <path d="M478 126h24M478 214h24M478 302h24M478 390h24M502 126v264"/>
      <path d="M502 258h24" marker-end="url(#arrow-context)"/>
      <path d="M716 230h32"/>
      <path d="M716 320h32"/>
    </g>
    <text x="500" y="494" text-anchor="middle" font-size="14" fill="#466873">压缩只改变本轮注入，不删除原始记录</text>
  </g>
</svg>
